<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada · Bici Busão Sampa</title>
  <link rel="stylesheet" href="/tokens.css">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--ui-surface-page); color: var(--ui-content-primary); font: var(--ui-type-body); }
    main { padding: var(--ui-space-inset-xl); text-align: center; }
    h1 { margin: 0 0 var(--ui-space-gap-sm); font: var(--ui-type-title); }
    a { color: var(--ui-accent-default); }
  </style>
</head>
<body>
  <!-- Its presence also turns off Cloudflare Pages' single-page fallback: a missing
       file answers 404 instead of index.html (whose Link preload headers, resolved
       against the missing path, used to send the browser into a loop). -->
  <main>
    <h1>Página não encontrada</h1>
    <p><a href="/">Voltar para o mapa</a></p>
  </main>
</body>
</html>
